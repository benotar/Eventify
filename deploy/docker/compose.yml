services:
  eventify_db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: eventify_db
    ports:
      - '1433:1433'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword2026!
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - eventify_db_data:/var/opt/mssql

  eventify_cache:
    image: redis:latest
    container_name: eventify_cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  eventify_db_data:
  redis_data:
    driver: local
